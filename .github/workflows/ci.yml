name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  # Kept out of the test job so a vulnerability disclosure never masks a real
  # test failure, and so this keeps reporting when the suite is red.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Floating patch on purpose: most govulncheck findings for a CLI this
          # small are standard-library ones fixed by a toolchain bump, so
          # tracking the latest 1.26.x is what actually keeps releases clean.
          go-version: '1.26'
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Validates .goreleaser.yaml on every PR, so a broken release config surfaces
  # here rather than after a tag has already been pushed.
  goreleaser-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: check
